name: Build apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build luci-theme-macos apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Download OpenWrt SDK 25.12.6 (x86/64)
        run: |
          SDK_FILE=openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          curl -fL --retry 3 -o "/tmp/$SDK_FILE" \
            "https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/$SDK_FILE"
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -I zstd -xf "/tmp/$SDK_FILE" -C "$RUNNER_TEMP/sdk" --strip-components=1
          rm -f "/tmp/$SDK_FILE"
          ls "$RUNNER_TEMP/sdk" | head -20

      - name: Add theme to the SDK
        run: |
          mkdir -p "$RUNNER_TEMP/sdk/package/luci-theme-macos"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/sdk/package/luci-theme-macos"
          ls "$RUNNER_TEMP/sdk/package/luci-theme-macos"

      - name: Update feeds
        working-directory: ${{ runner.temp }}/sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

      - name: Configure
        working-directory: ${{ runner.temp }}/sdk
        run: make defconfig

      - name: Compile package
        working-directory: ${{ runner.temp }}/sdk
        run: make package/luci-theme-macos/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        working-directory: ${{ runner.temp }}/sdk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find bin/packages -name 'luci-theme-macos*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          find bin/packages -name 'luci-theme-macos*.ipk' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -l "$GITHUB_WORKSPACE/out"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum * > sha256sums.txt

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-macos-apk
          path: out/
          if-no-files-found: error
