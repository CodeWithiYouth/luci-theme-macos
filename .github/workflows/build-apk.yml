name: Build apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build luci-theme-macos apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Download OpenWrt SDK 25.12.6 (x86/64)
        run: |
          SDK_FILE=openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          curl -fL --retry 3 -o "/tmp/$SDK_FILE" \
            "https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/$SDK_FILE"
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -I zstd -xf "/tmp/$SDK_FILE" -C "$RUNNER_TEMP/sdk" --strip-components=1
          rm -f "/tmp/$SDK_FILE"
          ls "$RUNNER_TEMP/sdk" | head -20

      - name: Add theme to the SDK
        run: |
          mkdir -p "$RUNNER_TEMP/sdk/package/luci-theme-macos"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/sdk/package/luci-theme-macos"
          ls "$RUNNER_TEMP/sdk/package/luci-theme-macos"

      - name: Update feeds
        working-directory: ${{ runner.temp }}/sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

      - name: Configure
        working-directory: ${{ runner.temp }}/sdk
        run: make defconfig

      - name: Compile package
        working-directory: ${{ runner.temp }}/sdk
        run: make package/luci-theme-macos/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        working-directory: ${{ runner.temp }}/sdk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find bin/packages -name 'luci-theme-macos*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          find bin/packages -name 'luci-theme-macos*.ipk' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -l "$GITHUB_WORKSPACE/out"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum * > sha256sums.txt

      - name: Inspect package
        working-directory: ${{ runner.temp }}/sdk
        run: |
          PKG=$(ls "$GITHUB_WORKSPACE"/out/*.apk | head -1)
          echo "== $PKG =="
          ls -l "$PKG"

          if [ -x staging_dir/host/bin/apk ]; then
            staging_dir/host/bin/apk --version || true
            staging_dir/host/bin/apk adbdump "$PKG" > /tmp/pkg.json 2>/tmp/pkg.err || true
            echo "== adbdump (head) =="
            head -c 1500 /tmp/pkg.json || true
            echo
            cat /tmp/pkg.err || true
            echo "== files in package =="
            grep -oE '"(path|name)":"[^"]*"' /tmp/pkg.json | head -40 || true
          fi

          echo "== staged tree =="
          find build_dir -path '*luci-theme-macos*' -type f \( -name '*.ut' -o -name 'cascade.css' -o -name 'menu.d*' \) | head -10

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-macos-apk
          path: out/
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download apk artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-theme-macos-apk
          path: out

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
