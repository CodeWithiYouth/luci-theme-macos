name: Build packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apk (OpenWrt 25.12.6)
            sdk_version: 25.12.6
            sdk_file: openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            ext: apk
            artifact: luci-theme-macos-apk
          - label: ipk (OpenWrt 24.10.8)
            sdk_version: 24.10.8
            sdk_file: openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            ext: ipk
            artifact: luci-theme-macos-ipk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Download OpenWrt SDK ${{ matrix.sdk_version }} (x86/64)
        run: |
          curl -fL --retry 3 -o "/tmp/${{ matrix.sdk_file }}" \
            "https://downloads.openwrt.org/releases/${{ matrix.sdk_version }}/targets/x86/64/${{ matrix.sdk_file }}"
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -I zstd -xf "/tmp/${{ matrix.sdk_file }}" -C "$RUNNER_TEMP/sdk" --strip-components=1
          rm -f "/tmp/${{ matrix.sdk_file }}"
          ls "$RUNNER_TEMP/sdk" | head -20

      - name: Add theme to the SDK
        run: |
          mkdir -p "$RUNNER_TEMP/sdk/package/luci-theme-macos"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/sdk/package/luci-theme-macos"
          ls "$RUNNER_TEMP/sdk/package/luci-theme-macos"

      - name: Update feeds
        working-directory: ${{ runner.temp }}/sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

      - name: Configure
        working-directory: ${{ runner.temp }}/sdk
        run: make defconfig

      - name: Compile package
        working-directory: ${{ runner.temp }}/sdk
        run: make package/luci-theme-macos/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        working-directory: ${{ runner.temp }}/sdk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find bin/packages -name 'luci-theme-macos*.${{ matrix.ext }}' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -l "$GITHUB_WORKSPACE/out"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum * > sha256sums.txt

      - name: Inspect package
        working-directory: ${{ runner.temp }}/sdk
        run: |
          PKG=$(ls "$GITHUB_WORKSPACE"/out/*.${{ matrix.ext }} | head -1)
          echo "== $PKG =="
          ls -l "$PKG"

          if [ "${PKG##*.}" = apk ] && [ -x staging_dir/host/bin/apk ]; then
            staging_dir/host/bin/apk --version || true
            staging_dir/host/bin/apk adbdump "$PKG" > /tmp/pkg.json 2>/tmp/pkg.err || true
            echo "== adbdump (head) =="
            head -c 1500 /tmp/pkg.json || true
            echo
            cat /tmp/pkg.err || true
            echo "== files in package =="
            grep -oE '"(path|name)":"[^"]*"' /tmp/pkg.json | head -40 || true
          fi

          if [ "${PKG##*.}" = ipk ]; then
            tar -tzf "$PKG" | head -40 || true
          fi

          echo "== staged tree =="
          find build_dir -path '*luci-theme-macos*' -type f \( -name '*.ut' -o -name 'cascade.css' -o -name 'menu.d*' \) | head -10

      - name: Upload ${{ matrix.ext }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: luci-theme-macos-*
          merge-multiple: true
          path: out

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
